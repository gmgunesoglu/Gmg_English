<div class="text-create-container">
  <div class="padding-container">

    <div class="title-container">
      <label>Unit Name: {{ unit.name }}</label>
<!--      <label>Title:</label>-->
      <input id="title" type="text" [(ngModel)]="create_text.title" name="title" required placeholder="Enter a Title">
    </div>

    <div class="context-container">
<!--      <label for="context">Context:</label>-->
      <textarea id="context" [(ngModel)]="create_text.context" name="context" required placeholder="Enter context..."></textarea>
    </div>

    <div class="buttons-container">
      <button type="reset" (click)="cancelCreateNewText()">Back</button>
      <button type="submit" (click)="createNewText()">Create</button>
    </div>

  </div>
</div>
